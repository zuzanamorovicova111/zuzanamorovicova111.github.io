<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mgr. Zuzana Morovičová – dokumenty ku kampani</title>
<meta name="description" content="Mgr. Zuzana Morovičová, nezávislá kandidátka, Galanta: správa o prostriedkoch vynaložených na volebnú kampaň a sprievodný list na stiahnutie vo formáte PDF.">
<meta name="theme-color" content="#4e1123">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,500..900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #4e1123;      /* bordová z plagátu; biely text na nej 14.7 : 1 (WCAG AA ✓) */
    --accent: #be9142;     /* zlatá z plagátu (linky, okraje) */
    --accent-text: #7a5c26;/* tmavšia zlatá pre text na krémovej 4.9 : 1 (WCAG AA ✓) */
    --page: #efe9de;
    --ink: #2b0e18;
    --line: rgba(78,17,35,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 80% at 20% 0%, #fbf8f2 0%, var(--page) 60%, #e6dccb 100%);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 620px; }

  /* Hlavička */
  h1 {
    font-stretch: 75%; font-weight: 800; text-transform: uppercase;
    color: var(--brand);
    font-size: min(52px, calc((100vw - 40px) / 12.6)); line-height: 1; letter-spacing: .005em;
    white-space: nowrap;
    margin: 0;
  }
  .rola {
    display: flex; align-items: center; gap: 16px;
    margin: 22px 0 0;
    font-stretch: 85%; font-weight: 700; text-transform: uppercase;
    letter-spacing: .16em; font-size: 15px; color: var(--brand);
  }
  .rola::before { content: ""; width: 44px; height: 2px; background: var(--accent); flex: none; }

  /* Dokumenty */
  .dokumenty {
    margin: 44px 0 0;
    background: rgba(255,255,255,.62);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 26px 8px;
    box-shadow: 0 14px 36px rgba(46,10,22,.08);
  }
  .dokumenty-nadpis {
    display: flex; align-items: center; gap: 12px;
    margin: 0 0 6px;
    font-stretch: 85%; font-weight: 600; font-style: italic; text-transform: uppercase;
    letter-spacing: .12em; font-size: 14px; color: var(--accent-text);
  }
  .dokumenty-nadpis::after { content: ""; flex: 1; height: 1px; background: rgba(190,145,66,.45); }

  .doc {
    display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; justify-content: space-between;
    padding: 20px 0;
  }
  .doc + .doc { border-top: 1px solid var(--line); }
  .doc-info { flex: 1 1 260px; display: flex; gap: 14px; align-items: flex-start; }
  .doc-ikona {
    flex: none; width: 40px; height: 48px; border-radius: 6px;
    background: #fbf8f2; border: 1.5px solid var(--accent);
    display: grid; place-items: center;
    font-stretch: 80%; font-weight: 800; font-size: 11px; letter-spacing: .04em; color: var(--brand);
  }
  .doc h2 {
    margin: 2px 0 0;
    font-stretch: 80%; font-weight: 800; text-transform: uppercase;
    font-size: 19px; line-height: 1.18; color: var(--brand);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 48px;
    padding: 12px 22px; border-radius: 999px;
    background: var(--brand); color: #fff; text-decoration: none;
    border: 2px solid var(--accent);
    font-stretch: 90%; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 15px;
    transition: background .2s;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:hover { background: #6e1e39; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .podpis { display: block; width: min(280px, 66%); height: auto; margin: 36px 0 0 6px; }

  @media (max-width: 480px) {
    .dokumenty { padding: 22px 18px 6px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<main>
  <h1>Mgr. Zuzana Morovičová</h1>
  <p class="rola">Nezávislá kandidátka</p>

  <section class="dokumenty" aria-labelledby="dok-nadpis">
    <p class="dokumenty-nadpis" id="dok-nadpis">Dokumenty k volebnej kampani</p>

    <div class="doc">
      <div class="doc-info">
        <span class="doc-ikona" aria-hidden="true">PDF</span>
        <h2>Správa o prostriedkoch vynaložených na volebnú kampaň</h2>
      </div>
      <a class="btn" href="https://drive.google.com/uc?export=download&amp;id=1JqokjaOSc8A-PHbDRp_KU1tSNPGZFuMX" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg>
        Stiahnuť PDF
      </a>
    </div>

    <div class="doc">
      <div class="doc-info">
        <span class="doc-ikona" aria-hidden="true">PDF</span>
        <h2>Sprievodný list</h2>
      </div>
      <a class="btn" href="https://drive.google.com/uc?export=download&amp;id=1Fk8L6_1HTkEIasGd3RFPVXOFXYQ6yaWo" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg>
        Stiahnuť PDF
      </a>
    </div>
  </section>

  <img class="podpis" src="podpis-zm.png" alt="Podpis Zuzana Morovičová" width="720" height="240">
</main>
</body>
</html>
